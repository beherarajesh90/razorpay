apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: postgres-data
  namespace: razorpay
spec:
  accessModes: ["ReadWriteOnce"]
  resources:
    requests:
      storage: 5Gi
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
  namespace: razorpay
  labels:
    app: postgres
spec:
  replicas: 1
  strategy:
    type: Recreate # one RWO volume: stop the old pod before starting the new one
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      enableServiceLinks: false
      containers:
        - name: postgres
          image: postgres:18-alpine
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 5432
          env:
            - name: POSTGRES_USER
              value: "postgres"
            - name: POSTGRES_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql # same mount point as compose; PG18 image puts PGDATA below it
            - name: init
              mountPath: /docker-entrypoint-initdb.d
              readOnly: true
          readinessProbe:
            exec:
              command: ["pg_isready", "-U", "postgres"]
            initialDelaySeconds: 10
            periodSeconds: 10
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: postgres-data
        - name: init
          configMap:
            name: postgres-init
---
apiVersion: v1
kind: Service
metadata:
  name: postgres
  namespace: razorpay
spec:
  selector:
    app: postgres
  ports:
    - port: 5432
      targetPort: 5432
---
# Init scripts run only when the data volume is empty (first start).
apiVersion: v1
kind: ConfigMap
metadata:
  name: postgres-init
  namespace: razorpay
data:
  01-create-databases.sql: |
    CREATE DATABASE merchant_db;
    CREATE DATABASE payment_db;
    CREATE DATABASE vault_db;
    CREATE DATABASE operations_db;
