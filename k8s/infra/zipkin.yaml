apiVersion: apps/v1
kind: Deployment
metadata:
  name: zipkin
  namespace: razorpay
  labels:
    app: zipkin
spec:
  replicas: 1
  selector:
    matchLabels:
      app: zipkin
  template:
    metadata:
      labels:
        app: zipkin
    spec:
      enableServiceLinks: false
      containers:
        - name: zipkin
          image: openzipkin/zipkin:3
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 9411
          env:

      volumes:
        []
---
apiVersion: v1
kind: Service
metadata:
  name: zipkin
  namespace: razorpay
spec:
  selector:
    app: zipkin
  ports:
    - port: 9411
      targetPort: 9411
