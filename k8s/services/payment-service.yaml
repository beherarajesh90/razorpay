apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-service
  namespace: razorpay
  labels:
    app: payment-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: payment-service
  template:
    metadata:
      labels:
        app: payment-service
    spec:
      enableServiceLinks: false
      containers:
        - name: payment-service
          image: razorpay/payment-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8083
          envFrom:
            - configMapRef:
                name: razorpay-config
          env:
            - name: SERVER_PORT
              value: "8083"

            - name: PAYMENT_DB_URL
              value: "jdbc:postgresql://postgres:5432/payment_db"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8083
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8083
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: payment-service
  namespace: razorpay
spec:
  selector:
    app: payment-service
  ports:
    - port: 8083
      targetPort: 8083
