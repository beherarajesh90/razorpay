apiVersion: apps/v1
kind: Deployment
metadata:
  name: discovery-service
  namespace: razorpay
  labels:
    app: discovery-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: discovery-service
  template:
    metadata:
      labels:
        app: discovery-service
    spec:
      enableServiceLinks: false
      containers:
        - name: discovery-service
          image: razorpay/discovery-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8761
          envFrom:
            - configMapRef:
                name: razorpay-config
          env:
            - name: SERVER_PORT
              value: "8761"

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8761
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8761
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: discovery-service
  namespace: razorpay
spec:
  selector:
    app: discovery-service
  ports:
    - port: 8761
      targetPort: 8761
