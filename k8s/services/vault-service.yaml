apiVersion: apps/v1
kind: Deployment
metadata:
  name: vault-service
  namespace: razorpay
  labels:
    app: vault-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vault-service
  template:
    metadata:
      labels:
        app: vault-service
    spec:
      enableServiceLinks: false
      containers:
        - name: vault-service
          image: razorpay/vault-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8082
          envFrom:
            - configMapRef:
                name: razorpay-config
          env:
            - name: SERVER_PORT
              value: "8082"

            - name: VAULT_DB_URL
              value: "jdbc:postgresql://postgres:5432/vault_db"

            - name: VAULT_MASTER_KEY
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: VAULT_MASTER_KEY

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8082
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8082
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: vault-service
  namespace: razorpay
spec:
  selector:
    app: vault-service
  ports:
    - port: 8082
      targetPort: 8082
