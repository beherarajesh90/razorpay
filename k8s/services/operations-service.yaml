apiVersion: apps/v1
kind: Deployment
metadata:
  name: operations-service
  namespace: razorpay
  labels:
    app: operations-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: operations-service
  template:
    metadata:
      labels:
        app: operations-service
    spec:
      enableServiceLinks: false
      containers:
        - name: operations-service
          image: razorpay/operations-service:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8084
          envFrom:
            - configMapRef:
                name: razorpay-config
          env:
            - name: SERVER_PORT
              value: "8084"

            - name: OPERATIONS_DB_URL
              value: "jdbc:postgresql://postgres:5432/operations_db"

            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: app-secrets
                  key: DB_PASSWORD

          readinessProbe:
            httpGet:
              path: /actuator/health/readiness
              port: 8084
            initialDelaySeconds: 30
            periodSeconds: 10
            failureThreshold: 12
          livenessProbe:
            httpGet:
              path: /actuator/health/liveness
              port: 8084
            initialDelaySeconds: 60
            periodSeconds: 20
            failureThreshold: 5
---
apiVersion: v1
kind: Service
metadata:
  name: operations-service
  namespace: razorpay
spec:
  selector:
    app: operations-service
  ports:
    - port: 8084
      targetPort: 8084
