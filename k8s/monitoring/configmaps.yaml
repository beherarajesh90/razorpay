          "timezone": "browser",
          "schemaVersion": 39,
          "version": 1,
          "refresh": "30s",
          "time": {
            "from": "now-1h",
            "to": "now"
          },
          "panels": [
            {
              "id": 9,
              "type": "timeseries",
              "title": "Heap used",
              "datasource": {
                "type": "prometheus",
                "uid": "prometheus"
              },
              "gridPos": {
                "x": 0,
                "y": 0,
                "w": 12,
                "h": 8
              },
              "fieldConfig": {
                "defaults": {
                  "unit": "bytes"
                },
                "overrides": []
              },
              "options": {
                "legend": {
                  "displayMode": "list",
                  "placement": "bottom"
                },
                "tooltip": {
                  "mode": "multi"
                }
              },
              "targets": [
                {
                  "datasource": {
                    "type": "prometheus",
                    "uid": "prometheus"
                  },
                  "expr": "sum by (application, instance) (jvm_memory_used_bytes{area=\"heap\"})",
                  "legendFormat": "{{application}} {{instance}}",
