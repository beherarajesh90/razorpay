apiVersion: v1
kind: ConfigMap
metadata:
  name: prometheus-config
  namespace: razorpay
data:
  prometheus.yml: |
        global:
          scrape_interval: 15s

        scrape_configs:
          - job_name: razorpay-services
            metrics_path: /actuator/prometheus
            static_configs:
              - targets:
                  - api-gateway-service:8080
                  - merchant-service:8081
                  - vault-service:8082
                  - payment-service:8083
                  - operations-service:8084

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-datasources
  namespace: razorpay
data:
  prometheus.yml: |
        apiVersion: 1
        datasources:
          - name: Prometheus
            uid: prometheus
            type: prometheus
            access: proxy
            url: http://prometheus:9090
            isDefault: true
            editable: false

---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboards-provider
  namespace: razorpay
data:
  razorpay.yml: |
        apiVersion: 1
        providers:
          - name: razorpay
            orgId: 1
            folder: Razorpay
            type: file
            disableDeletion: true
            allowUiUpdates: false
            options:
              path: /var/lib/grafana/dashboards

