spring:
  application:
    name: api-gateway-service
  config:
    import: optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: merchant-service
              uri: lb://merchant-service
              predicates:
                - Path=/v1/auth/**,/v1/merchants/**,/v1/admin/**
            - id: payment-service
              uri: lb://payment-service
              predicates:
                - Path=/v1/orders/**,/v1/payments/**
            - id: vault-service
              uri: lb://vault-service
              predicates:
                - Path=/v1/vault/**
            - id: operations-service
              uri: lb://operations-service
              predicates:
                - Path=/webhook/**

server:
  port: ${SERVER_PORT:8080}

eureka:
  client:
    service-url:
      defaultZone: ${EUREKA_DEFAULT_ZONE:http://localhost:8761/eureka/}

gateway:
  auth-base-url: http://merchant-service
  public-paths:
    - /v1/auth/signup
    - /v1/auth/login
    - /webhook/**
    - /actuator/**
