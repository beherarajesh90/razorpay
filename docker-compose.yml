x-service-env: &service-env
  CONFIG_SERVER_URL: http://config-service:8888
  EUREKA_DEFAULT_ZONE: http://discovery-service:8761/eureka/
  ZIPKIN_ENDPOINT: http://zipkin:9411/api/v2/spans
  REDIS_HOST: redis
  KAFKA_BOOTSTRAP_SERVERS: kafka:9092
  DB_USERNAME: ${DB_USERNAME:-postgres}
  DB_PASSWORD: ${DB_PASSWORD:-postgres}

x-service-base: &service-base
  restart: unless-stopped

services:
  postgres:
    image: postgres:18-alpine
    container_name: razorpay-postgres
    environment:
      POSTGRES_USER: ${DB_USERNAME:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USERNAME:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: razorpay-redis
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --appendonly yes
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka:
    image: docker.io/confluentinc/confluent-local:7.5.0
    container_name: razorpay-kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: 'broker,controller'
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: 'CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT'
      KAFKA_CONTROLLER_QUORUM_VOTERS: '1@kafka:29093'
      KAFKA_LISTENERS: 'PLAINTEXT://0.0.0.0:9092,CONTROLLER://0.0.0.0:29093,PLAINTEXT_HOST://0.0.0.0:29092'
      KAFKA_ADVERTISED_LISTENERS: 'PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:29092'
      KAFKA_CONTROLLER_LISTENER_NAMES: 'CONTROLLER'
      KAFKA_INTER_BROKER_LISTENER_NAME: 'PLAINTEXT'
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      CLUSTER_ID: 'XuUO1MrQQaGtE2KYgqaU_g'
    volumes:
      - kafka-data:/var/lib/kafka/data
    restart: unless-stopped

  control-center:
    image: confluentinc/cp-enterprise-control-center:7.5.0
    container_name: razorpay-control-center
    depends_on:
      kafka:
        condition: service_started
    ports:
      - "9021:9021"
    environment:
      CONTROL_CENTER_BOOTSTRAP_SERVERS: 'kafka:9092'
      CONTROL_CENTER_REPLICATION_FACTOR: 1
      CONTROL_CENTER_INTERNAL_TOPICS_PARTITIONS: 1
      CONTROL_CENTER_MONITORING_INTERCEPTOR_TOPIC_PARTITIONS: 1
      CONFLUENT_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_INTERNAL_TOPICS_REPLICATION_FACTOR: 1
      CONTROL_CENTER_COMMAND_TOPIC_REPLICATION_FACTOR: 1
      CONTROL_CENTER_METRICS_TOPIC_REPLICATION: 1
      CONTROL_CENTER_STREAMS_NUM_STREAM_THREADS: 2
      CONTROL_CENTER_UI_LABEL: Razorpay Kafka
    restart: unless-stopped

  zipkin:
    image: openzipkin/zipkin:3
    container_name: razorpay-zipkin
    ports:
      - "9411:9411"
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: razorpay-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./infra/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.6.0
    container_name: razorpay-grafana
    depends_on:
      - prometheus
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./infra/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

  discovery-service:
    build:
      context: .
      args:
        SERVICE: discovery-service
    image: razorpay/discovery-service
    container_name: discovery-service
    ports:
      - "8761:8761"
    restart: unless-stopped

  config-service:
    build:
      context: .
      args:
        SERVICE: config-service
    image: razorpay/config-service
    container_name: config-service
    ports:
      - "8888:8888"
    restart: unless-stopped

  merchant-service:
    <<: *service-base
    build:
      context: .
      args:
        SERVICE: merchant-service
    image: razorpay/merchant-service
    container_name: merchant-service
    environment:
      <<: *service-env
      MERCHANT_DB_URL: jdbc:postgresql://postgres:5432/merchant_db
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?set JWT_SECRET_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  vault-service:
    <<: *service-base
    build:
      context: .
      args:
        SERVICE: vault-service
    image: razorpay/vault-service
    container_name: vault-service
    environment:
      <<: *service-env
      VAULT_DB_URL: jdbc:postgresql://postgres:5432/vault_db
      VAULT_MASTER_KEY: ${VAULT_MASTER_KEY:?set VAULT_MASTER_KEY in .env}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  payment-service:
    <<: *service-base
    build:
      context: .
      args:
        SERVICE: payment-service
    image: razorpay/payment-service
    container_name: payment-service
    environment:
      <<: *service-env
      PAYMENT_DB_URL: jdbc:postgresql://postgres:5432/payment_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  operations-service:
    <<: *service-base
    build:
      context: .
      args:
        SERVICE: operations-service
    image: razorpay/operations-service
    container_name: operations-service
    environment:
      <<: *service-env
      OPERATIONS_DB_URL: jdbc:postgresql://postgres:5432/operations_db
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_started

  api-gateway-service:
    <<: *service-base
    build:
      context: .
      args:
        SERVICE: api-gateway-service
    image: razorpay/api-gateway-service
    container_name: api-gateway-service
    environment:
      <<: *service-env
      MERCHANT_SERVICE_URL: http://merchant-service:8081
    ports:
      - "8080:8080"

volumes:
  postgres-data:
  redis-data:
  kafka-data:
  grafana-data:
