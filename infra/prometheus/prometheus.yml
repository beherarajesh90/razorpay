global:
  scrape_interval: 15s

scrape_configs:
  - job_name: razorpay-services
    metrics_path: /actuator/prometheus
    static_configs:
      - targets:
          - api-gateway-service:8080
          - merchant-service:8081
          - vault-service:8082
          - payment-service:8083
          - operations-service:8084
